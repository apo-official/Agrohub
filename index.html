:root{--brand:#3CA835;--brand2:#22884f;--tint:#eaf7e8;--bg:#f6f8fb;--card:#fff;--ink:#314155;--mut:#6b7a8d;--line:#e3e8ef;--shadow:0 6px 24px rgba(49,65,85,.08);--on:#fff;color-scheme:light}
:root[data-t="harvest"]{--brand:#f08a1c;--brand2:#c96a08;--tint:#fff1e0;--bg:#fbf7f1}
:root[data-t="berry"]{--brand:#8e44ad;--brand2:#6c2f87;--tint:#f3e8f9;--bg:#f8f5fa}
:root[data-t="ocean"]{--brand:#0e9fb0;--brand2:#0a7482;--tint:#e0f5f8;--bg:#f2f8fa}
:root[data-t="dark"]{--brand:#4cc243;--brand2:#3CA835;--tint:#1d2b22;--bg:#0f161d;--card:#18212b;--ink:#e8eef5;--mut:#93a2b5;--line:#26323f;--shadow:0 6px 24px rgba(0,0,0,.4);--on:#0f161d;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
*:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:"FiraGO",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px);transition:background .3s,color .3s;overflow-x:hidden}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;user-select:none;-webkit-user-select:none}
input{cursor:text;user-select:text;-webkit-user-select:text}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.logo svg{height:30px;width:auto}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;height:68px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:44px;min-width:0;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.search input{flex:1;min-width:0;height:100%}
.search svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.ic{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;transition:background .2s,transform .15s}
.ic:hover{background:var(--tint)}
.ic:active{transform:scale(.92)}
